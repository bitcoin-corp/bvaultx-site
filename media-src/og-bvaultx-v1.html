<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#000;color:#f4f1e8;font-family:'IBM Plex Sans';position:relative;overflow:hidden}
body::before{content:"";position:absolute;right:-120px;top:40px;width:720px;height:620px;background:radial-gradient(closest-side,rgba(245,184,0,.22),transparent 70%)}
.logo{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:14px;font:700 34px/1 'Space Grotesk';letter-spacing:-.02em}
.g{color:#ffd24d}
h1{position:absolute;left:72px;top:136px;margin:0;font:700 84px/1 'Space Grotesk';letter-spacing:-.05em}
h1 span{background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#c98f00);-webkit-background-clip:text;color:transparent}
p{position:absolute;left:72px;top:448px;margin:0;width:600px;font:400 27px/1.35 'IBM Plex Sans';color:#cfcabd}
.foot{position:absolute;left:72px;bottom:52px;font:500 22px/1 'Space Grotesk';color:#7c7a73}
.foot b{color:#f4f1e8;font-weight:500}
.card{position:absolute;right:72px;top:120px;width:390px;background:#0d0e11;border:1px solid #2a2c33;border-radius:22px;padding:26px;transform:rotate(3deg);box-shadow:0 40px 80px -30px rgba(245,184,0,.4)}
.h{display:flex;justify-content:space-between;font:600 17px/1 'Space Grotesk';color:#a9a69c}
.ex{font:500 13px/1 'Space Grotesk';letter-spacing:.12em;color:#7c7a73}
.av{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#c98f00);display:grid;place-items:center;font:700 20px/1 'Space Grotesk';color:#000;flex:none}
.who{display:flex;gap:14px;align-items:center;margin:22px 0 14px}.who b{display:block;font:600 22px/1.2 'Space Grotesk'}.who small{color:#7c7a73;font-size:17px}
.ln{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid #1d1e23;font-size:18px;color:#a9a69c}.ln span:last-child{color:#f4f1e8}
.tot{font:600 22px/1.2 'Space Grotesk';color:#f4f1e8}.tot span:last-child{color:#ffd24d}
.seal{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(245,184,0,.08);border:1px solid rgba(255,210,77,.3);font-size:16px;color:#cfcabd}
</style></head><body>
<div class="logo"><img src="../logo.svg" width="30" height="40"><span>bVault<span class="g">X</span></span></div>
<h1>The vault<br>that pays<br><span>for itself.</span></h1>
<p>Lock BSV once. It pays for your storage, month by month.</p>
<div class="foot"><b>bvaultx.com</b> · Prepaid, time-locked, yours</div>
<div class="card"><div class="h"><span>Storage plan</span><span class="ex">EXAMPLE</span></div>
<div class="who"><div class="av">b</div><div><b>Family photos</b><small>bDriveX · 12 months</small></div></div>
<div class="ln"><span>Paid</span><span>Month by month</span></div>
<div class="ln"><span>Unspent BSV</span><span>Yours</span></div>
<div class="ln tot"><span>Covered until</span><span>Oct 2027</span></div>
<div class="seal">Keys stay with you</div></div>
</body></html>
